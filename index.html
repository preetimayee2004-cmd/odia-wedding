<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EBD3A5" />
    <!-- tila:meta -->
    <!-- Dark until the app starts, so the opening never flashes the cream page.
         The app switches the page to cream once the invitation is reached. -->
    <style>
      html { background: #3b2010; }
      html body { background: transparent; }
    </style>

    <!-- The opening's temple door: needed on the very first screen -->
    <link rel="preload" as="image" href="/art/temple-door.webp" type="image/webp" fetchpriority="high" />
    <!-- The invitation card, shown as the opening's curtain lifts -->
    <link rel="preload" as="image" href="/art/invitation-card.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500&family=Noto+Sans+Oriya:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
